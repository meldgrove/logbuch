# Publishes a release when a tag vX.Y.Z is pushed (X.Y.Z is the version in
# package.json; CONTRIBUTING.md has the steps):
#
# - the image ghcr.io/meldgrove/logbuch for linux/amd64 and linux/arm64, tagged
#   X.Y.Z and X.Y, and latest when it is the newest release
# - a provenance attestation of the image, signed by GitHub
# - a GitHub release with notes generated from the merged pull requests
#
# A tag with a suffix (v0.2.0-rc.1) publishes only that image tag and a
# prerelease. On pull requests that change the image, both platforms are built
# and started without publishing anything.
#
# Only GitHub-owned actions, pinned by commit SHA (enforced in the
# repository's Actions settings): Docker is used through its command line.

name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-entrypoint.sh
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/meldgrove/logbuch

jobs:
  version:
    name: Version and image tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tags: ${{ steps.version.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag, to tell whether this release is the newest one.
          fetch-depth: 0
      - id: version
        run: |
          version="$(jq -r .version package.json)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="${GITHUB_REF_NAME#v}"
            case "$tag" in
              "$version" | "$version"-*) ;;
              *)
                echo "::error::The tag $GITHUB_REF_NAME does not match the version in package.json ($version)."
                exit 1
                ;;
            esac
            version="$tag"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$version is not a version like 1.2.3 or 1.2.3-rc.1."
            exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          tags="$IMAGE:$version"
          if [ "$prerelease" = false ]; then
            tags="$tags $IMAGE:${version%.*}"
            newest="$(git tag --list 'v[0-9]*' --sort=-version:refname | awk '!/-/ && !found { print; found = 1 }')"
            if [ "$GITHUB_REF_TYPE" = tag ] && [ "$newest" = "v$version" ]; then
              tags="$tags $IMAGE:latest"
            fi
          fi
          echo "Version $version (prerelease: $prerelease), tags: $tags"
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

  image:
    name: Image (${{ matrix.platform }})
    needs: version
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          # A BuildKit container: it can push an image by its digest alone.
          docker buildx create --use --driver docker-container
          # The push step builds again with the same labels, so from the cache.
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "CREATED=$created" >> "$GITHUB_ENV"
          docker buildx build . --platform "$PLATFORM" --provenance=false \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.created=$created" \
            --output type=docker,name=logbuch:test
      - name: The image starts on its platform, as a non-root user
        run: |
          test "$(docker run --rm --entrypoint node logbuch:test -p process.arch)" = "${ARCH/amd64/x64}"
          test "$(docker run --rm --entrypoint id logbuch:test -u)" = "1000"
      - name: Log in to the GitHub Container Registry
        if: github.event_name == 'push'
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest
        if: github.event_name == 'push'
        run: |
          # The same build again, from the cache, pushed without a tag: the
          # publish job tags both platforms together.
          docker buildx build . --platform "$PLATFORM" --provenance=false \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.created=$CREATED" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/metadata.json"
          mkdir -p "$RUNNER_TEMP/digests"
          jq -er '."containerimage.digest"' "$RUNNER_TEMP/metadata.json" > "$RUNNER_TEMP/digests/$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    if: github.event_name == 'push'
    needs: [version, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the GitHub release
      packages: write # the image tags and the attestation
      id-token: write # signs the attestation
      attestations: write
      artifact-metadata: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      TAGS: ${{ needs.version.outputs.tags }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Log in to the GitHub Container Registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag both platforms as one image
        id: image
        run: |
          args=()
          for tag in $TAGS; do args+=(--tag "$tag"); done
          for annotation in \
            "org.opencontainers.image.title=Meldgrove Logbuch" \
            "org.opencontainers.image.description=A self-hosted log of an organization's decisions, updates, and learnings, with a consent-based decision process." \
            "org.opencontainers.image.source=https://github.com/meldgrove/logbuch" \
            "org.opencontainers.image.licenses=Apache-2.0" \
            "org.opencontainers.image.version=$VERSION" \
            "org.opencontainers.image.revision=$GITHUB_SHA"; do
            args+=(--annotation "index:$annotation")
          done
          test "$(find "$RUNNER_TEMP/digests" -type f | wc -l)" -eq 2
          for file in "$RUNNER_TEMP"/digests/*; do args+=("$IMAGE@$(cat "$file")"); done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -er .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME exists already."
            exit 0
          fi
          latest=legacy
          if [ "$PRERELEASE" = true ]; then latest=false; fi
          body="$(printf '%s\n' \
            "Image: \`$IMAGE:$VERSION\` (linux/amd64, linux/arm64)" \
            "" \
            "With Docker Compose, set \`LOGBUCH_VERSION=$VERSION\` in \`.env\` and run \`docker compose up -d\`. \`migrate\` applies new database migrations before \`web\` and \`worker\` start; see [Deployment](https://github.com/meldgrove/logbuch/blob/$GITHUB_REF_NAME/docs/deployment.md)." \
            "" \
            "Check that the image was built here: \`gh attestation verify oci://$IMAGE:$VERSION --repo $GITHUB_REPOSITORY\`")"
          gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="$GITHUB_REF_NAME" \
            -f body="$body" \
            -F generate_release_notes=true \
            -F prerelease="$PRERELEASE" \
            -f make_latest="$latest" \
            --jq .html_url
